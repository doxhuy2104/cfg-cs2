// ==================================================
// RESET KEY BINDS
// ==================================================

unbindall


// ==================================================
// WEAPON SLOTS
// ==================================================

bind "0" "slot10"
bind "1" "slot1; switchhands;"
bind "2" "slot2; switchhands;"
bind "3" "slot3; switchhands;"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"

bind "q" "lastinv"
bind "x" "slot12"

bind "," "invprev"
bind "." "invnext"


// ==================================================
// MOVEMENT
// ==================================================

bind "w" "+forward"
bind "s" "+back"
bind "a" "+left"
bind "d" "+right"

bind "v" "+jump"
bind "MWHEELUP" "+jump"
bind "MWHEELDOWN" "+jump"

bind "SPACE" "+duck"
bind "c" "+duck"
bind "CTRL" "+duck"

bind "SHIFT" "+sprint"
bind "MOUSE5" "+sprint"


// ==================================================
// COMBAT AND INTERACTION
// ==================================================

bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "player_ping"
bind "MOUSE4" "+voicerecord"

bind "e" "+use"
bind "r" "+reload"
bind "f" "+lookatweapon"
bind "g" "drop"

bind "MOUSE_X" "yaw"
bind "MOUSE_Y" "pitch"


// ==================================================
// MENU AND COMMUNICATION
// ==================================================

bind "b" "buymenu"
bind "m" "teammenu"

bind "y" "messagemode"
bind "u" "messagemode2"

bind "z" "radio"
bind "t" "+spray_menu"
bind "i" "show_loadout_toggle"

bind "TAB" "+showscores"
bind "ESCAPE" "cancelselect"
bind "DEL" "sellbackall"

bind "`" "toggleconsole"


// ==================================================
// FUNCTION KEYS
// ==================================================

bind "F3" "autobuy"
bind "F4" "rebuy"
bind "F5" "jpeg"
bind "F6" "save quick"
bind "F7" "load quick"
bind "F10" "cs_quit_prompt"


// ==================================================
// PRACTICE BINDS
// Chỉ hoạt động trong server/map cho phép sv_cheats
// ==================================================

sv_cheats 1

bind "n" "noclip"
bind "h" "give weapon_deagle"
bind "j" "sv_rethrow_last_grenade"
bind "k" "sv_cheats 1; mp_drop_knife_enable 1; subclass_create 521; drop"


// ==================================================
// SNIPER
// ==================================================

cl_sniper_auto_rezoom 0


// ==================================================
// RADAR
// ==================================================

cl_radar_always_centered 0
cl_radar_scale 0.36


// ==================================================
// PERFORMANCE AND DISPLAY
// ==================================================

fps_max 120
fps_max_ui 30

r_fullscreen_gamma 3.189987

cl_hud_telemetry_frametime_show 2
cl_hud_telemetry_ping_show 2
cl_hud_telemetry_net_misdelivery_show 2

cl_predict_kill_ragdolls 0


// ==================================================
// MOUSE SENSITIVITY
// ==================================================

sensitivity 1.250000
zoom_sensitivity_ratio 1.000000


// ==================================================
// CROSSHAIR
// ==================================================

cl_crosshairsize 1
cl_crosshairthickness 1
cl_crosshairgap -5
cl_crosshairstyle 4
cl_crosshaircolor 12

cl_crosshair_drawoutline 0
cl_crosshairalpha 255
cl_crosshairgap_useweaponvalue 0
cl_crosshair_recoil 0
cl_crosshairdot 0


// ==================================================
// VIEWMODEL
// ==================================================

viewmodel_offset_x 1
viewmodel_offset_y 0.000000
viewmodel_offset_z -2.000000


// ==================================================
// WORKSHOP MAP ALIASES
// ==================================================

alias "fast_warmup" "map_workshop 3083320026 fast"
alias "movement" "map_workshop 3355497176 movement_hub"
alias "aim_rush" "map_workshop 3105821815 aim_rush"
alias "cs2_aim" "map_workshop 3077265396 cs2_aimws"
alias "5e" "map_workshop 3086023598 5e_aimhub"